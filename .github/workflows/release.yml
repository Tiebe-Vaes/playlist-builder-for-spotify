name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Check tag matches plugin version
        run: node scripts/check-evals.mjs "$GITHUB_REF_NAME"
      - name: Zip skill for claude.ai upload
        working-directory: plugins/playlist-builder-for-spotify/skills
        run: zip -r "$GITHUB_WORKSPACE/playlist-builder-for-spotify.zip" playlist-builder-for-spotify
      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
            found && /^\[[^]]+\]: / { exit }
            found
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG entry for $version"; exit 1; }
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" playlist-builder-for-spotify.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
