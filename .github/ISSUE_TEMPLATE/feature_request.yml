name: Feature request
description: Suggest an improvement to the flow or the docs
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: checkboxes
    id: connector
    attributes:
      label: Connector check
      options:
        - label: I checked connector-limits.md and this is possible with the current Spotify connector tools
